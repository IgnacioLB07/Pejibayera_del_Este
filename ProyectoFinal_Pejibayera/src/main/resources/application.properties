spring.application.name=pejibayeraEste

#Definir el puerto al que se comunicara el servidor
server.port=8090

#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=dd:MM hh:mm

#Para elimnar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en produccion "true"
spring.thymeleaf.cache=false

#Conexión local a la BD practica en MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/xxxx
#spring.datasource.username=xxxx
#spring.datasource.password=xxxx
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Conexión a storage de Firebase
#firebase.bucket.name=storage.firebasestorage.app
#firebase.storage.path=xxxx
#firebase.json.path=xxxx
#firebase.json.file=storage-firebase-adminsdk-fbsvc-xxxx.json