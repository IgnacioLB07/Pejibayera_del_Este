texto.proposito=Promover la tradici\u00f3n costarricense del consumo de pejibaye, ofreciendo un producto fresco, nutritivo y de alta calidad que conecte a las personas con las ra\u00edces agr\u00edcolas de nuestro pa\u00eds. Buscamos apoyar a los productores locales, fortalecer la econom\u00eda de nuestras comunidades y llevar el sabor aut\u00e9ntico del pejibaye a m\u00e1s familias costarricenses.
texto.mision=Somos una empresa costarricense dedicada a la producci\u00f3n, selecci\u00f3n y comercializaci\u00f3n de pejibayes frescos y productos derivados, ofreciendo a nuestros clientes alimentos naturales de excelente calidad, cultivados de manera responsable y sostenible. Trabajamos con pasi\u00f3n para preservar una tradici\u00f3n gastron\u00f3mica nacional mientras brindamos una experiencia de compra confiable, cercana y accesible.
texto.vision=Ser la tienda de pejibayes l\u00edder en Costa Rica, reconocida por la calidad de nuestros productos, nuestro compromiso con los agricultores nacionales y nuestra contribuci\u00f3n a la preservaci\u00f3n de una de las tradiciones alimentarias m\u00e1s representativas del pa\u00eds. Aspiramos a expandir nuestra presencia a nivel nacional y convertirnos en el principal referente del pejibaye costarricense.

