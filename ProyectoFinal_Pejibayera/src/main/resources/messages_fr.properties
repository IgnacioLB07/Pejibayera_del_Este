texto.proposito=Promouvoir la tradition costaricienne de la consommation du fruit du palmier-p\u00eache (pejibaye), en offrant un produit frais, nutritif et de haute qualit\u00e9 qui relie les gens aux racines agricoles de notre pays. Nous cherchons \u00e0 soutenir les producteurs locaux, \u00e0 renforcer l'\u00e9conomie de nos communaut\u00e9s et \u00e0 apporter la saveur authentique du pejibaye \u00e0 un plus grand nombre de familles costariciennes.
texto.mision=Nous sommes une entreprise costaricienne d\u00e9di\u00e9e \u00e0 la production, la s\u00e9lection et la commercialisation de pejibayes frais et de produits d\u00e9riv\u00e9s, offrant \u00e0 nos clients des aliments naturels d'excellente qualit\u00e9, cultiv\u00e9s de mani\u00e8re responsable et durable. Nous travaillons avec passion pour pr\u00e9server une tradition gastronomique nationale tout en offrant une exp\u00e9rience d'achat fiable, proche et accessible.
texto.vision=\u00catre la boutique de pejibayes leader au Costa Rica, reconnue pour la qualit\u00e9 de nos produits, notre engagement envers les agriculteurs nationaux et notre contribution \u00e0 la pr\u00e9servation de l'une des traditions alimentaires les plus repr\u00e9sentatives du pays. Nous aspirons \u00e0 \u00e9tendre notre pr\u00e9sence \u00e0 l'\u00e9chelle nationale et \u00e0 devenir la principale r\u00e9f\u00e9rence du pejibaye costaricien.

