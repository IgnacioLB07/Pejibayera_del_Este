texto.proposito=Promuovere la tradizione costaricana del consumo del frutto di palma (pejibaye), offrendo un prodotto fresco, nutriente e di alta qualit\u00e0 che connetta le persone alle radici agricole del nostro paese. Ci proponiamo di supportare i produttori locali, rafforzare l'economia delle nostre comunit\u00e0 e portare l'autentico sapore del pejibaye a pi\u00f9 famiglie costaricane.
texto.mision=Siamo un'azienda costaricana dedicata alla produzione, selezione e commercializzazione di pejibaye freschi e prodotti derivati, offrendo ai nostri clienti alimenti naturali di eccellente qualit\u00e0, coltivati in modo responsabile e sostenibile. Lavoriamo con passione per preservare una tradizione gastronomica nazionale offrendo al contempo un'esperienza di acquisto affidabile, vicina e accessibile.
texto.vision=Essere il negozio di pejibaye leader in Costa Rica, riconosciuto per la qualit\u00e0 dei nostri prodotti, il nostro impegno verso gli agricoltori nazionali e il nostro contributo alla preservazione di una delle tradizioni alimentari pi\u00f9 rappresentative del paese. Aspiriamo ad ampliare la nostra presenza a livello nazionale e a diventare il principale punto di riferimento del pejibaye costaricano.

