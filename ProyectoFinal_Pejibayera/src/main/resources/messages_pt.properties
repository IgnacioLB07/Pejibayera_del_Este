texto.proposito=Promover a tradi\u00e7\u00e3o costarriquenha do consumo de pupunha (pejibaye), oferecendo um produto fresco, nutritivo e de alta qualidade que conecte as pessoas com as ra\u00edzes agr\u00edcolas do nosso pa\u00eds. Buscamos apoiar os produtores locais, fortalecer a economia de nossas comunidades e levar o sabor aut\u00eantico da pupunha a mais fam\u00edlias costarriquenhas.
texto.mision=Somos uma empresa costarriquenha dedicada \u00e0 produ\u00e7\u00e3o, sele\u00e7\u00e3o e comercializa\u00e7\u00e3o de pupunhas frescas e produtos derivados, oferecendo aos nossos clientes alimentos naturais de excelente qualidade, cultivados de maneira respons\u00e1vel e sustent\u00e1vel. Trabalhamos com paix\u00e3o para preservar uma tradi\u00e7\u00e3o gastron\u00f4mica nacional enquanto oferecemos uma experi\u00eancia de compra confi\u00e1vel, pr\u00f3xima e acess\u00edvel.
texto.vision=Ser a loja de pupunhas l\u00edder na Costa Rica, reconhecida pela qualidade dos nossos produtos, nosso compromisso com os agricultores nacionais e nossa contribui\u00e7\u00e3o para a preserva\u00e7\u00e3o de uma das tradi\u00e7\u00f5es alimentares mais representativas do pa\u00eds. Aspiramos expandir nossa presen\u00e7a em n\u00edvel nacional e nos tornar a principal refer\u00eancia em pupunha costarriquenha.

