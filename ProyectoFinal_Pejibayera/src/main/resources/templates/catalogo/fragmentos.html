<!--fragmento 1 listado con todos los productos para ${tipoUsuairo}, se maneja desde el Controlador-->
<section th:fragment="listado" class="p-3">
    <div class="row p-3">
        <div class="col-md-9">
            <div class="card p-2">
                <div class="card-header"><h4>[[#{producto.listado}]]</h4></div>
                <div class="card-body">
                    <div th:if="${productos != null and !productos.empty}">
                        <table class="table table-striped table-hover">
                            <thead><tr>
                                    <th>#</th>
                                    <th>[[#{producto.descripcion}]]</th>
                                    <th>[[#{producto.imagen}]]</th>
                                    <th>[[#{producto.activo}]]</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${productos}">
                                    <td>[[${p.idProducto}]]</td>
                                    <td>[[${p.descripcion}]]</td>
                                    <td><img th:if="${p.rutaImagen != null}" th:src="${p.rutaImagen}" alt="Imagen de producto" height="75"/></td>
                                    <td th:text="${p.activo} ? #{producto.estado.activa} : #{producto.estado.inactiva}"></td>
                                    <td sec:authorize="hasRole('ROLE_USUARIO')">
                                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#confirmModal"
                                                th:data-bs-id="${p.idProducto}" th:data-bs-descripcion="${p.descripcion}">
                                            <i class="fa-solid fa-trash"></i> [[#{accion.agregar}]]
                                        </button>                                                                                        
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${productos == null or productos.empty}">
                        <span>[[#{lista.vacia}]]</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!--<div class="col-md-3">
            <div class="card text-center bg-success text-white mb-3">
                <div class="card-body"><h3>[[#{producto.total}]]</h3>
                    <h4 class="fs-2"><i class="fas fa-layer-group"></i> [[${totalProductos}]]</h4>
                </div>
            </div>
        </div>-->
    </div>
</section>
