spring.application.name=pejibayeraEste

# Perfil de desarrollo
spring.profiles.active=local

# Definir el puerto del servidor
server.port=8090

# Formato de fecha y hora del log
logging.pattern.dateformat=dd:MM hh:mm

# Eliminar el banner de Spring
spring.main.banner-mode=off

# Configuración de Thymeleaf
spring.thymeleaf.cache=false

# CONFIGURACIÓN JPA / HIBERNATE

# No modificar las tablas existentes
spring.jpa.hibernate.ddl-auto=none

# Mostrar información SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Registros de consultas SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


