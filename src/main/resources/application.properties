spring.application.name=pejibayeraEste

# Perfil de desarrollo
spring.profiles.active=local

# Definir el puerto del servidor
server.port=8090

# Formato de fecha y hora del log
logging.pattern.dateformat=dd:MM hh:mm

# Eliminar el banner de Spring
spring.main.banner-mode=off

# Configuración de Thymeleaf
spring.thymeleaf.cache=false

# CONFIGURACIÓN JPA / HIBERNATE

# No modificar las tablas existentes
spring.jpa.hibernate.ddl-auto=none

# Mostrar información SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Registros de consultas SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# FIREBASE (NO UTILIZADO ACTUALMENTE)
 firebase.storage.bucket=pejibayeraeste.firebasestorage.app
 firebase.storage.path=pejibayeraeste
 firebase.json.path=firebase
 firebase.json.file=pejibayeraeste-firebase-adminsdk-fbsvc-528ec3b538.json

# CONFIGURACIÓN LOCAL DE CADA INTEGRANTE
# Cada integrante tendrá su propio application-local.properties
# para conectar su MySQL local con sus credenciales.
# Esto evita compartir contraseñas y modificar la configuración común.

# CONEXIÓN LOCAL A MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/pejibayera_del_este
spring.datasource.username=root
spring.datasource.password=shelos11
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver