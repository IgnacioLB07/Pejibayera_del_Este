
<!-- Fragmento: catálogo completo de productos -->

<section th:fragment="listado" class="container py-5">

    <div class="text-center mb-5">
        <h2 class="fw-bold">Nuestro catálogo</h2>
        <p class="text-muted">
            Descubre todos nuestros productos de pejibaye.
        </p>
    </div>

    <!-- Mensajes -->
    <div th:if="${todoOk}"
         class="alert alert-success"
         th:text="${todoOk}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <!-- Productos -->
    <div th:if="${productos != null and !productos.empty}">

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">

            <div th:each="p : ${productos}" class="col">

                <div class="card h-100 shadow-sm">

                    <!-- Imagen -->
                    <div class="d-flex justify-content-center align-items-center bg-light p-3"
                         style="height: 220px;">

                        <img th:if="${p.rutaImagen != null and !#strings.isEmpty(p.rutaImagen)}"
                             th:src="${p.rutaImagen}"
                             th:alt="${p.nombre}"
                             class="img-fluid"
                             style="max-height: 100%; object-fit: contain;"/>

                        <i th:unless="${p.rutaImagen != null and !#strings.isEmpty(p.rutaImagen)}"
                           class="fas fa-image fa-3x text-secondary">
                        </i>

                    </div>

                    <!-- Nombre -->
                    <div class="card-header bg-white">

                        <h5 class="card-title text-center fw-bold mb-0"
                            th:text="${p.nombre}">
                            Producto
                        </h5>

                    </div>

                    <!-- Descripción -->
                    <div class="card-body">

                        <p class="card-text text-muted"
                           th:text="${p.detalle}">
                            Descripción del producto.
                        </p>

                        <h5 class="text-success fw-bold"
                            th:text="|₡${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}|">
                            ₡0.00
                        </h5>

                        <div th:if="${p.existencias > 0}">
                            <span class="badge text-bg-success"
                                  th:text="${p.existencias} + ' unidades disponibles'">
                            </span>
                        </div>

                        <div th:unless="${p.existencias > 0}">
                            <span class="badge text-bg-danger">
                                Agotado
                            </span>
                        </div>

                    </div>

                    <!-- Botón de compra -->
                    <div class="card-footer bg-white">

                        <form th:action="@{/carrito/agregar}"
                              method="POST"
                              sec:authorize="hasAuthority('ROLE_CLIENTE')">

                            <input type="hidden"
                                   name="idProducto"
                                   th:value="${p.idProducto}"/>

                            <button type="submit"
                                    class="btn btn-primary w-100"
                                    th:disabled="${p.existencias == 0}">

                                <i class="fas fa-cart-plus me-2"></i>
                                Agregar al carrito

                            </button>

                        </form>

                        <a th:href="@{/login}"
                           sec:authorize="isAnonymous()"
                           class="btn btn-outline-primary w-100">

                            Inicia sesión para comprar

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Catálogo vacío -->
    <div th:if="${productos == null or productos.empty}"
         class="text-center py-5">

        <i class="fas fa-box-open fa-3x text-secondary mb-3"></i>

        <h4>No hay productos disponibles</h4>

        <p class="text-muted">
            Pronto tendremos nuevos productos.
        </p>

    </div>

</section>
