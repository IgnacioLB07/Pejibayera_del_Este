<!--fragmento 1 para informacion general-->
<section th:fragment="info" class="info-section py-4">
    <div class="container info-container">
        <div class="row justify-content-center">
            <div class="col-12">
                
                <!-- Tarjeta Propósito -->
                <div class="proposito">
                    <div class="card card-info shadow-sm">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold info-title">[[#{info.proposito}]]</h5>
                            <p class="card-text mb-0">[[#{texto.proposito}]]</p>
                        </div>
                    </div>
                </div>

                <!-- Tarjeta Misión -->
                <div class="mision">
                    <div class="card card-info shadow-sm">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold info-title">[[#{info.mision}]]</h5>
                            <p class="card-text mb-0">[[#{texto.mision}]]</p>
                        </div>
                    </div>
                </div>

                <!-- Tarjeta Visión -->
                <div class="vision">
                    <div class="card card-info shadow-sm">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold info-title">[[#{info.vision}]]</h5>
                            <p class="card-text mb-0">[[#{texto.vision}]]</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
