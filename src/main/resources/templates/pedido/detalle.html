
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <!-- Encabezado -->
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container py-5">

            <!-- Título -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="fw-bold">
                    <i class="fas fa-receipt me-2"></i>
                    Detalle del pedido
                </h2>

                <a th:href="@{/pedido/historial}"
                   class="btn btn-outline-secondary">

                    <i class="fas fa-arrow-left me-1"></i>
                    Volver al historial

                </a>

            </div>

            <!-- Información general del pedido -->
            <div class="card shadow-sm mb-4">

                <div class="card-header bg-white">
                    <h5 class="fw-bold mb-0"
                        th:text="|Pedido #${pedido.idPedido}|">
                        Pedido #1
                    </h5>
                </div>

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-md-4">

                            <span class="text-muted">
                                Fecha de compra
                            </span>

                            <p class="fw-semibold mb-0"
                               th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">
                                Fecha
                            </p>

                        </div>

                        <div class="col-md-4">

                            <span class="text-muted">
                                Estado del pedido
                            </span>

                            <p class="mb-0">

                                <span class="badge text-bg-warning"
                                      th:text="${pedido.estado}">
                                    Pendiente
                                </span>

                            </p>

                        </div>

                        <div class="col-md-4">

                            <span class="text-muted">
                                Total del pedido
                            </span>

                            <p class="fw-bold text-success fs-5 mb-0"
                               th:text="${#numbers.formatCurrency(pedido.total)}">
                                ₡0.00
                            </p>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Productos comprados -->
            <div class="card shadow-sm">

                <div class="card-header bg-white">
                    <h5 class="fw-bold mb-0">
                        Productos comprados
                    </h5>
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-striped table-hover align-middle">

                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio unitario</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="d : ${detalles}">

                                    <td th:text="${d.producto.nombre}">
                                        Producto
                                    </td>

                                    <td th:text="|₡${#numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')}|">
                                        ₡0.00
                                    </td>

                                    <td th:text="${d.cantidad}">
                                        1
                                    </td>

                                    <td class="fw-bold"
                                        th:text="|₡${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}|">
                                        ₡0.00
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                    <!-- Total -->
                    <div class="d-flex justify-content-end mt-3">

                        <div class="text-end">

                            <span class="text-muted">
                                Total de la compra
                            </span>

                            <h4 class="fw-bold text-success"
                               th:text="|₡${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT')}|"
                                ₡0.00
                            </h4>

                        </div>

                    </div>

                </div>

            </div>

        </main>

        <!-- Pie de página -->
        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
